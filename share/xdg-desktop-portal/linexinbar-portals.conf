# Which backend answers which question, for a LineXinBar session.
#
# The name is what xdg-desktop-portal looks for and cannot be prettier than
# this: it lowercases XDG_CURRENT_DESKTOP and appends `-portals.conf`, so a
# file spelled the way the session spells itself is a file it never opens —
# which is what left this session relying on the deprecated `UseIn` key in
# `portals/lxb.portal` instead.
#
# Screen sharing is this session's own, because only its compositor can read
# its screen. Everything else — file choosers, settings, notifications — is
# deliberately left to whatever the machine already has, so that a desktop
# portal LineXinBar has no implementation for degrades to somebody else's
# rather than to nothing at all.
[preferred]
default=lxb;gtk;gnome;kde;
org.freedesktop.impl.portal.ScreenCast=lxb;
