<!--
  The Intellivision: the cartridge slot across the top, and the two hand
  controllers docked in the face of the machine below it — a disc over a keypad,
  twice.

  Nobody who saw one saw the console alone.  Mattel built the controllers into
  the master component, so what a person remembers is a wide box with two of
  those things sitting in it, and a disc with a keypad under it is a thing no
  other console here has anywhere.  Drawn as a bare keypad it was a calculator.

  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="body" x="3" y="8.4" width="26" height="15.4" rx="2"/>
    <rect id="slot" x="6.4" y="10.4" width="19.2" height="2.8" rx="0.8"/>
    <g id="discs">
      <circle cx="11.2" cy="16" r="1.5"/>
      <circle cx="20.8" cy="16" r="1.5"/>
    </g>
    <g id="keypads">
      <rect x="9.2" y="18.4" width="4" height="3.2" rx="0.6"/>
      <rect x="18.8" y="18.4" width="4" height="3.2" rx="0.6"/>
    </g>
    <mask id="pierced">
      <use href="#body" fill="#ffffff"/>
      <use href="#slot" fill="#000000"/>
      <use href="#discs" fill="#000000"/>
      <use href="#keypads" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#body" fill="#ffffff"/>
  </g>
</svg>
