<!--
  The Commodore 64: the breadbin, two rows of keys and a sloped top.

  The wedge is what tells it from the flat computer slabs either side of it,
  and two rows of keys against their one is the second thing. See
  console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="body" d="M3.4 12.4 28.6 10v14a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2z"/>
    <g id="keys">
      <rect x="6.4" y="14.4" width="5" height="3" rx="0.7"/>
      <rect x="13.8" y="14.4" width="5" height="3" rx="0.7"/>
      <rect x="21.2" y="14.4" width="5" height="3" rx="0.7"/>
      <rect x="6.4" y="20.2" width="5" height="3" rx="0.7"/>
      <rect x="13.8" y="20.2" width="5" height="3" rx="0.7"/>
      <rect x="21.2" y="20.2" width="5" height="3" rx="0.7"/>
    </g>
    <mask id="pierced">
      <use href="#body" fill="#ffffff"/>
      <use href="#keys" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#body" fill="#ffffff"/>
  </g>
</svg>
