<!--
  The Sega Master System: the wedge, with the cartridge slot on the high side
  and the card slot beside it.

  Two openings of plainly different size is the mark — this is the one machine
  here that took both, and the sloped top is what says wedge rather than box.
  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="wedge" d="M3.4 12.8 28.6 8.6v14.6a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2z"/>
    <rect id="cart" x="14.6" y="12.6" width="11.4" height="3" rx="0.9"/>
    <rect id="card" x="6.6" y="16.4" width="6" height="2.8" rx="0.8"/>
    <g id="ports"><circle cx="17.6" cy="20.4" r="1.35"/><circle cx="23" cy="20.4" r="1.35"/></g>
    <mask id="pierced">
      <use href="#wedge" fill="#ffffff"/>
      <use href="#cart" fill="#000000"/>
      <use href="#card" fill="#000000"/>
      <use href="#ports" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#wedge" fill="#ffffff"/>
  </g>
</svg>
