<!--
  The Neo Geo AES: one cartridge slot the width of the machine, and two big
  controller ports with the memory card between them.

  It was drawn with two slots, which is a machine SNK never made.  One slot is
  right, and it is a wide one — an AES cartridge is the size of a hardback book,
  and the deck was built round it.

  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="deck" x="3" y="8.6" width="26" height="15" rx="2.2"/>
    <rect id="slot" x="7.4" y="10.8" width="17.2" height="3.2" rx="0.9"/>
    <g id="ports">
      <rect x="6" y="17.6" width="5.6" height="3" rx="0.9"/>
      <rect x="20.4" y="17.6" width="5.6" height="3" rx="0.9"/>
    </g>
    <rect id="card" x="13.8" y="17.6" width="4.4" height="3" rx="0.8"/>
    <mask id="pierced">
      <use href="#deck" fill="#ffffff"/>
      <use href="#slot" fill="#000000"/>
      <use href="#ports" fill="#000000"/>
      <use href="#card" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#deck" fill="#ffffff"/>
  </g>
</svg>
