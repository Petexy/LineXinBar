<!--
  The PC-FX: the beige tower, its CD lid on the top, an FX card slot in the
  middle and the power button low down.

  The one machine here that looks like a desktop computer, which is what NEC
  built — squatter than the PlayStation 2 across the column, and the only tower
  on this shelf that opens at the top.

  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="body" x="9.2" y="3" width="13.6" height="26" rx="1.6"/>
    <circle id="lid" cx="16" cy="8.6" r="3.6"/>
    <rect id="slot" x="12" y="15.4" width="8" height="2.5" rx="0.7"/>
    <circle id="power" cx="16" cy="21.8" r="1.2"/>
    <mask id="pierced">
      <use href="#body" fill="#ffffff"/>
      <use href="#lid" fill="#000000"/>
      <use href="#slot" fill="#000000"/>
      <use href="#power" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#body" fill="#ffffff"/>
  </g>
</svg>
