<!--
  The Atari 5200: the biggest machine on this shelf, its controller store raised
  across the back and four ports along the front.

  Two tiers is the machine.  Atari put a hinged lid over a well deep enough to
  swallow two of those enormous controllers, and set it behind the cartridge
  slot, so the thing reads as a box with another box on its back — which nothing
  else in this column does.  Four ports, as the first one shipped.

  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="hood" x="6.4" y="6.4" width="19.2" height="6.8" rx="1.8"/>
    <rect id="deck" x="3.2" y="12.4" width="25.6" height="12.6" rx="2"/>
    <rect id="slot" x="8" y="14.8" width="11.2" height="3" rx="0.9"/>
    <g id="ports">
      <circle cx="8.2" cy="21.2" r="1.25"/><circle cx="13.4" cy="21.2" r="1.25"/>
      <circle cx="18.6" cy="21.2" r="1.25"/><circle cx="23.8" cy="21.2" r="1.25"/>
    </g>
    <g id="bead"><use href="#hood"/><use href="#deck"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#slot" fill="#000000"/>
      <use href="#ports" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
