<!--
  The Atari 7800: the rounded wedge, its cartridge slot across the middle and
  the four buttons in a row under it.

  Power, reset, select and pause — four of them, round, and all on the console
  rather than on a pad.  Against the VCS higher up the column: that one is a
  square-shouldered box with four switches at its front edge and the slot behind
  them; this one is soft at every corner and has the slot in the middle.

  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="deck" x="2.6" y="10.2" width="26.8" height="12.6" rx="3.6"/>
    <rect id="slot" x="9.2" y="12.4" width="13.6" height="3" rx="0.9"/>
    <g id="buttons">
      <circle cx="10" cy="19" r="1.3"/><circle cx="14" cy="19" r="1.3"/>
      <circle cx="18" cy="19" r="1.3"/><circle cx="22" cy="19" r="1.3"/>
    </g>
    <mask id="pierced">
      <use href="#deck" fill="#ffffff"/>
      <use href="#slot" fill="#000000"/>
      <use href="#buttons" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#deck" fill="#ffffff"/>
  </g>
</svg>
