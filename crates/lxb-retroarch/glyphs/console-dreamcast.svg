<!--
  The Dreamcast: as deep as it is wide, soft the whole way round, with a small
  lid on top and four ports along the front.

  Four controller ports, which is what it has — it was drawn with two memory
  card slots on its flank instead, and those live in the controllers, not the
  machine.  Held against the GameCube higher up this column: that one is a hard
  square under a lid nearly its own width, and this one is a rounded square
  under a lid half of it.

  Its earlier drawings put the lid in the middle over a bar and read, twice, as
  a face.  Four ports rather than two is most of what stopped that.

  See console-nes.svg for the set's rules.

  lxb:shape
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="body" x="4" y="6.4" width="24" height="19.6" rx="4.6"/>
    <circle id="lid" cx="16" cy="13.2" r="4.6"/>
    <g id="ports">
      <circle cx="8.2" cy="21.8" r="1.3"/><circle cx="13.4" cy="21.8" r="1.3"/>
      <circle cx="18.6" cy="21.8" r="1.3"/><circle cx="23.8" cy="21.8" r="1.3"/>
    </g>
    <mask id="pierced">
      <use href="#body" fill="#ffffff"/>
      <use href="#lid" fill="#000000"/>
      <use href="#ports" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#body" fill="#ffffff"/>
  </g>
</svg>
