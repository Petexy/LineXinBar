<!--
  The PlayStation 3 row, column and every game without an icon of its own:
  RPCS3's "3", from RPCS3's own icon — three bars joined down the right, the
  two gaps between them open to the left and rounded at their ends, and the
  right side pinched in a little where the middle bar meets it.

  The console set's rule is the machine rather than its logo (see
  console-nes.svg in lxb-retroarch). This mark is the exception the user asked
  for on 2026-09-29: the PlayStation 3 here is RPCS3, and RPCS3's "3" is what
  somebody who uses it looks for. It is drawn anew on this set's grid rather
  than copied — RPCS3's proportions (bars to gaps as 40 to 47, the whole as wide
  as three halves its height), with no part narrower than the set's two and a
  half units — and without RPCS3's tile, which the category's own tile is.

  It ships in the lxb-rpcs3 package and is read at startup out of
  share/lxb/glyphs as lxb:ps3.

  lxb:shape
-->

