<!--
The System column's glyph: a display on a stand.

  System collects the things that administer the machine — the XDG `System` and
  `Settings` groups both land here — and a monitor is the one object that says
  "the computer itself" without saying which part of it.

  The screen is not drawn as a dark hole, which is what a switched-off screen
  actually looks like and what this glyph cannot have: the atlas multiplies the
  quad's colour into the texel, so ink darker than the label beside it is not
  reachable, and a hole punched through would show the application behind as a
  black slab. It is drawn instead as what a switched-off screen looks like in a
  lit room — glass, sunk a little into its bezel, reflecting the lamp in one
  hard diagonal band. That reads as a screen and stays inside the ink the glyph
  is allowed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>

    <filter id="crevice" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.55" result="soft"/>
      <feFlood flood-color="#4a4a4a" flood-opacity="0.55" result="ink"/>
      <feComposite in="ink" in2="soft" operator="in"/>
    </filter>

    <rect id="panel" x="3.2" y="4" width="25.6" height="17.2" rx="2.6"/>
    <path id="panel-gloss" d="M2 2H30V12.4C25.24 14.13 6.76 14.13 2 12.4z"/>
    <clipPath id="panel-clip"><use href="#panel"/></clipPath>
    <clipPath id="screen-clip"><rect x="5.6" y="6.4" width="20.8" height="12.4" rx="1.3"/></clipPath>
    <clipPath id="foot-clip"><rect x="8.8" y="24" width="14.4" height="3" rx="1.5"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <!-- The stand, behind the panel so the panel's own shadow falls on it. -->
    <rect x="13.7" y="20.4" width="4.6" height="4.4" fill="url(#face)"/>
    <rect x="8.8" y="24" width="14.4" height="3" rx="1.5" fill="url(#face)"/>
    <g clip-path="url(#foot-clip)">
      <rect x="8.8" y="24" width="14.4" height="3" rx="1.5"
            fill="none" stroke="url(#edge)" stroke-width="1"/>
    </g>

    <use href="#panel" fill="url(#face)"/>
    <g clip-path="url(#panel-clip)">
      <use href="#panel-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#panel" fill="url(#turn)"/>
    <g clip-path="url(#panel-clip)">
      <use href="#panel" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    </g>

    <!-- The glass, sunk into the bezel, with the lamp across it. -->
    <rect x="5.6" y="6.4" width="20.8" height="12.4" rx="1.3" fill="url(#recess)"/>
    <g clip-path="url(#screen-clip)">
      <g filter="url(#polish)">
        <path d="M4 15.6L14.8 5h5.2L6.6 19.6z" fill="#ffffff" fill-opacity="0.3"/>
        <path d="M23.4 5h2.6L12 19.6H9.4z" fill="#ffffff" fill-opacity="0.19"/>
      </g>
      <rect x="5.6" y="6.4" width="20.8" height="12.4" rx="1.3"
            fill="none" stroke="url(#edge)" stroke-width="0.8"/>
    </g>
  </g>
</svg>
