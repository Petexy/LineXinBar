<!--
The Settings column's glyph: a cog.

  This column is the shell's own settings and is always first, the way the real
  XMB opens on Settings. A cog rather than the toolbox that console used,
  because the toolbox is wanted two columns along for Utilities, and of the two
  marks the cog is the one that means "the machine's own controls" rather than
  "tools you run".

  The teeth, the root circle and the flanks are one closed path rather than a
  disc with eight rectangles laid round it. That matters here: a single shape
  can be clipped, so the polish can be laid over the whole cog at once and stop
  along one curve. Eight separate teeth would each take their own copy of the
  gradient and come out identically shaded, which is the flat pinwheel this
  replaces.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>

    <path id="cog" d="M12.97 6.58L13.56 3.34A12.8 12.8 0 0 1 18.44 3.34L19.03 6.58A9.8 9.8 0 0 1 20.45 7.17L23.16 5.29A12.8 12.8 0 0 1 26.61 8.74L24.73 11.45A9.8 9.8 0 0 1 25.32 12.87L28.56 13.46A12.8 12.8 0 0 1 28.56 18.34L25.32 18.93A9.8 9.8 0 0 1 24.73 20.35L26.61 23.06A12.8 12.8 0 0 1 23.16 26.51L20.45 24.63A9.8 9.8 0 0 1 19.03 25.22L18.44 28.46A12.8 12.8 0 0 1 13.56 28.46L12.97 25.22A9.8 9.8 0 0 1 11.55 24.63L8.84 26.51A12.8 12.8 0 0 1 5.39 23.06L7.27 20.35A9.8 9.8 0 0 1 6.68 18.93L3.44 18.34A12.8 12.8 0 0 1 3.44 13.46L6.68 12.87A9.8 9.8 0 0 1 7.27 11.45L5.39 8.74A12.8 12.8 0 0 1 8.84 5.29L11.55 7.17A9.8 9.8 0 0 1 12.97 6.58z"/>
    <path id="cog-gloss" d="M2 1H30V14.6C25.24 17.13 6.76 17.13 2 14.6z"/>
    <clipPath id="cog-clip"><use href="#cog"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#cog" fill="url(#face)"/>
    <g clip-path="url(#cog-clip)">
      <use href="#cog-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#cog" fill="url(#turn)"/>
    <g clip-path="url(#cog-clip)">
      <use href="#cog" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
    </g>

    <!-- The bore, sunk through the middle. -->
    <circle cx="16" cy="15.9" r="4.1" fill="url(#recess)"/>
    <circle cx="16" cy="15.9" r="4.1" fill="none" stroke="url(#edge)" stroke-width="0.8"/>
  </g>
</svg>
