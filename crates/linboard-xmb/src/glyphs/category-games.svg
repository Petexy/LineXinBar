<!--
The Games column's glyph: a gamepad.

  This is the third pad the shell draws, and the three have to be told apart at
  a glance, because two of them can be on screen at once — the guide's sidebar
  overlays the start screen. They are distinguished by how much of a controller
  each one is, which follows from what each is being asked:

    pointer-stick  a bare shell with one stick sunk in it, and nothing else,
                   because the question is *which stick*.
    pad-select     an outline with two buttons in the middle of it, one filled,
                   because the question is *which button*.
    this one       the whole object — solid, with a d-pad and four face
                   buttons — because the question is only "games".

  So this is the one that gets to be a controller rather than a diagram of one,
  and the only one with anything on it that is not being pointed at. The d-pad
  and the buttons are sunk into the shell rather than standing proud of it: at
  84 px, which is what this row gives an unselected column, a raised white cap
  on a white shell is carried entirely by its own shadow, and a recess has the
  shadow on the inside where the shell cannot lose it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>

    <path id="pad" d="M11 6.8h10a8 8 0 0 1 6.9 6.6l1 7.4a3.5 3.5 0 0 1-5.8 3.2l-2.4-4h-9.4l-2.4 4a3.5 3.5 0 0 1-5.8-3.2l1-7.4a8 8 0 0 1 6.9-6.6z"/>
    <path id="dpad" d="M9.85 10.9h1.9v1.55h1.55v1.9h-1.55v1.55h-1.9v-1.55H8.3v-1.9h1.55z"/>
    <path id="pad-gloss" d="M2 3H30V16.8C25.24 18.53 6.76 18.53 2 16.8z"/>
    <clipPath id="pad-clip"><use href="#pad"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#pad" fill="url(#face)"/>
    <g clip-path="url(#pad-clip)">
      <use href="#pad-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#pad" fill="url(#turn)"/>
    <g clip-path="url(#pad-clip)">
      <use href="#pad" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
    </g>

    <!-- The d-pad, cut into the left of the face. -->
    <use href="#dpad" fill="url(#recess)"/>
    <use href="#dpad" fill="none" stroke="url(#edge)" stroke-width="0.7"/>

    <!-- And the four on the right, in the diamond every pad agrees on even
         when it cannot agree what to print on them. -->
    <g fill="url(#recess)">
      <circle cx="21.4" cy="10.9" r="1.2"/>
      <circle cx="23.9" cy="13.4" r="1.2"/>
      <circle cx="21.4" cy="15.9" r="1.2"/>
      <circle cx="18.9" cy="13.4" r="1.2"/>
    </g>
    <g fill="none" stroke="url(#edge)" stroke-width="0.6">
      <circle cx="21.4" cy="10.9" r="1.2"/>
      <circle cx="23.9" cy="13.4" r="1.2"/>
      <circle cx="21.4" cy="15.9" r="1.2"/>
      <circle cx="18.9" cy="13.4" r="1.2"/>
    </g>
  </g>
</svg>
