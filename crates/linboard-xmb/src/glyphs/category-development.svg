<!--
The Development column's glyph: a pair of angle brackets round a slash.

  Editors, compilers and debuggers. `</>` is what the trade has settled on, and
  a wrench — the other candidate — belongs to Utilities two columns along.

  The only glyph in the set built out of strokes rather than filled shapes, so
  it is built the other way round: the three strokes are painted into a mask,
  and the material is then poured through that mask. A stroke cannot be
  clipped to, and painting a gradient *along* a stroke lights the two brackets
  differently depending on where they sit rather than lighting the object; this
  way the whole mark takes the polish as one surface, the way the die does.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <path id="code-gloss" d="M2 2H30V15.2C25.24 17.6 6.76 17.6 2 15.2z"/>
    <mask id="code-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <g fill="none" stroke="#ffffff" stroke-width="3.3"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M11.4 9.9L4.7 16l6.7 6.1"/>
        <path d="M20.6 9.9L27.3 16l-6.7 6.1"/>
        <path d="M18.5 7.3L13.5 24.7"/>
      </g>
    </mask>
  </defs>

  <g filter="url(#drop)">
    <g mask="url(#code-mask)">
      <rect x="0" y="0" width="32" height="32" fill="url(#face)"/>
      <use href="#code-gloss" fill="url(#gloss)" filter="url(#polish)"/>
      <rect x="0" y="0" width="32" height="32" fill="url(#turn)"/>
    </g>

    <!-- The lit upper shoulder of each stroke, which is what makes them read
         as rods rather than as ribbon laid flat on the page. -->
    <g mask="url(#code-mask)">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.1"
         stroke-linecap="round" stroke-linejoin="round"
         transform="translate(0 -0.85)">
        <path d="M11.4 9.9L4.7 16l6.7 6.1"/>
        <path d="M20.6 9.9L27.3 16l-6.7 6.1"/>
        <path d="M18.5 7.3L13.5 24.7"/>
      </g>
    </g>
  </g>
</svg>
