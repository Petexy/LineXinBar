[package]
name = "lxb-desktop"
description = "A console-style lattice shell for the LineXinBar compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lxb-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
fluent-bundle = "0.16"
unic-langid = "0.9"

# What the optional RetroArch integration says, and the only thing this shell
# and that package have to agree about: one JSON record per line on the
# helper's stdout. See `src/retroarch.rs`, which declares its own half of the
# format — this crate deliberately does not depend on `lxb-retroarch`, because
# a machine may have either package without the other.
serde_json = "1"
lxb-updates = { path = "../lxb-updates" }


# Wayland client: layer-shell, seat, keyboard.
#
# `calloop`/`system`: wgpu needs a real `wl_display` / `wl_surface` pointer from
# libwayland, which only the system backend exposes.
smithay-client-toolkit = "0.21"
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# The on-screen keyboard's three halves: hearing that a text field took the
# cursor, borrowing the physical keyboard while the board is up, and typing.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# Reading the session's own keymap, which the compositor hands over with the
# keyboard grab: the board has to know which key the user actually pressed.
# Pinned to the version smithay-client-toolkit uses, so `Keysym` is one type.
xkbcommon = "0.8"
lxb-protocol = { path = "../lxb-protocol", features = ["client"] }
# Signing in to Steam, reading somebody's library, and saying which of it is on
# this disk. Everything network-facing in this shell is in there and on a
# worker thread of its own; see `crates/lxb-steam`.
lxb-steam = { path = "../lxb-steam" }

# GPU rendering.
# The session's polkit agent, which is the shell's only D-Bus: `polkitd` lives
# on the system bus and an agent is registered there or not at all. See
# `src/polkit.rs` for why this is the shell rather than a process beside it.
# `async-channel` is what holds a `BeginAuthentication` call open while the
# panel is up — zbus already builds it, and a channel that can be awaited is
# what keeps that wait off the connection's own thread.
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
async-channel = "2"

wgpu = "30"
glyphon = "0.12"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
libc = "0.2"
gilrs = "0.11.2"
# The pad itself, one level below GilRs: grabbing a controller's own device
# node and standing a `uinput` device in its place, so that the guide button
# reaches this shell and no application. GilRs reads what is left, and cannot
# do this — it opens pads to read them and has no notion of taking one away.
# See `src/pad_guard.rs`.
evdev = "0.13"

# The shell's own sounds: decoding its four effects, streaming its Start music,
# and putting them on the machine's output.
#
# Playing, not mixing — the volume bars in the guide still go through `wpctl`
# and friends, because those set what the *session* is doing and this only adds
# one more thing playing into it. Cut to the two jobs it is here for: `playback`
# is the output device, `vorbis` is the format the clips are in. Every decoder
# beyond that would be a codec compiled in for a file this shell never opens.
# `tracing` is not optional in practice: without it rodio reports a lost device
# with `eprintln!`, and this shell's stderr is the console the session started
# from.
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "vorbis",
    "tracing",
] }

# Icon decoding, and the user's own photographs.
#
# The formats here are the ones a picture on somebody's disk is actually in.
# AVIF and HEIC are deliberately absent: both need a C codec built in, which
# would make the shell fail to build on a machine that has no libheif rather
# than fail to draw one thumbnail on a machine that does. Those files are
# listed like any other and keep the glyph.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    # A Steam game's own icon is a Windows `.ico` — a directory of sizes in one
    # file, which the decoder resolves to the largest. Nothing else in the shell
    # reads one; see `art::icon`.
    "ico",
] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }

# The keyboard layout registry: `rules/evdev.xml` under the xkb config root,
# which is where every layout this machine can be set to is described. Read
# rather than transcribed, so the settings page cannot offer an arrangement
# the compositor beside it would fail to compile. See `src/layouts.rs`.
#
# Already in this tree — resvg parses SVG with it — so the shell gains a name
# to call rather than a dependency to build.
roxmltree = "0.20"

# The user's own wallpaper: a picture or a film of theirs standing where the
# shell's own scene would be drawn. See `src/paper.rs`.
#
# Cut to three of its features, and the cut is the feature: `codec` and `format`
# open a file and decode its video stream, `software-scaling` turns what comes
# out into the RGBA the texture wants. There is deliberately no
# `software-resampling` and no `device`, so nothing this crate exposes here can
# turn a soundtrack into samples or open anything to play them on — which is one
# of the three reasons a film used as a wallpaper is silent. The other two are in
# `src/paper.rs`: its audio stream is never opened, and the only thing in this
# shell that makes a noise is `src/sound.rs` and its own embedded clips.
#
# One decoder for both kinds of file rather than the `image` crate for pictures
# and this for films: it is the wider of the two by a long way — an `.avif` and
# a `.heic` are listed as pictures by this shell and `image` is built here
# without either — and one path is one thing to be right about.
ffmpeg-next = { version = "9", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }
