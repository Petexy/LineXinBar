<!--
  The west face button, as the four of them.

  Three rings and one bead: the one to press is solid and the others are open.
  Nothing here is a pad — at the twenty-seven pixels a hint is drawn, four
  buttons say controller on their own and a body round them would only take
  room from them.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="12" cy="5.3" r="2.7"/>
    <circle cx="18.7" cy="12" r="2.7"/>
    <circle cx="12" cy="18.7" r="2.7"/>
  </g>
  <circle cx="5.3" cy="12" r="3.4" fill="#fff"/>
</svg>
