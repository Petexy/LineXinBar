<!--
  The Internet column's glyph: a globe.

  Latitudes and longitudes are the openings, cut as slits rather than drawn as
  lines: a line on a bead of water is a thing painted on it, and a slit is a
  thing the water was pulled away from.

  The meridians stop short of both poles. Run all the way up they would meet in
  a single hole at the top and the globe would come apart into segments; held
  back, the shape stays one body and the field keeps a continuous crown to
  stand its wall up on.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

