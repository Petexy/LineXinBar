  <path fill="#fff"
        d="M11.69 9.54 20.27 14.44a1.8 1.8 0 0 1 0 3.12L11.69 22.46
           a1.8 1.8 0 0 1-2.69-1.56V11.1a1.8 1.8 0 0 1 2.69-1.56z"/>
</svg>
