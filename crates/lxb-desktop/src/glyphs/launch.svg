<!--
  The play mark, on the context menu row that starts something.

  One shape with three round corners, and nothing else needed. A triangle is
  where the material does most for the least: its three corners are the only
  places on it where the wall turns through anything, so the light gathers there
  and the flat between them stays flat.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

