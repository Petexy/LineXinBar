<!--
  A jigsaw piece, for the row that says which compatibility tool a game runs
  under.

  A piece with a tab on one side and a socket on the other is what "this fits
  that" looks like, and that is exactly what a Steam Play tool is: a Windows
  game on one side, this machine on the other, and something shaped to join
  them. Nothing else in this set is a jigsaw, so the mark belongs to one row and
  cannot be mistaken for a page about the machine.

  The body is not centred in the cell and the whole mark is. The tab reaches
  28.35 and the socket bites in from 3.8, so the body is set a little left of
  centre to put the *ink's* middle on the cell's — a piece drawn from a centred
  square hangs to the right by the width of its own tab, which is visible on a
  row beside marks that do not.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="piece"
          d="M5.8 5h18a2 2 0 0 1 2 2v4.4
             c3.4 0 3.4 9.2 0 9.2V25a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-4.4
             c3.4 0 3.4-9.2 0-9.2V7a2 2 0 0 1 2-2z"/>
    <mask id="pierced">
      <use href="#piece" fill="#ffffff"/>
    </mask>
  </defs>
  <g mask="url(#pierced)">
    <use href="#piece" fill="#ffffff"/>
  </g>
</svg>
