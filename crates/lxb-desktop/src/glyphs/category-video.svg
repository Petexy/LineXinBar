<!--
The Video subcategory's glyph: a strip of film.

  The mark category-music.svg was drawn against — "a film strip would claim the
  column for video alone" — which is now precisely the job. It sits under
  Multimedia beside the note, and the pair have to divide their column at a
  glance: one is a thing you hear, the other a thing you look through.

  A strip rather than a reel, though a reel is the older mark. A reel is a
  circle, and the Internet column has already spent the set's one circle on a
  globe; a second would be a shape the bar has to read twice.

  The column above carries a strip too — it is drawn from its own two rows, so
  that what is inside is answerable from outside (category-multimedia.svg).
  That puts this drawing on screen twice at once, and the two have to be told
  apart without being read. They are, by the whole shape rather than by any
  part of it: the heading's strip stands portrait, narrow, with a note across
  it and only its left half showing. This one lies landscape and fills its
  square, alone, edge to edge. One is a strip in a picture of something; this
  is the strip.

  Sprockets and frames are sunk into the plate rather than punched through it,
  which is the gamepad's argument (category-games.svg) and it applies harder
  here: twelve openings, ten of them six pixels across at the 84 px an
  unselected column gets, and every one would be casting through to the
  wallpaper on its own account. Sunk in, the shadow stays on the inside where
  the plate keeps hold of it.

  The two rhythms have to stay two. Sprockets and frames were nearer the same
  size and nearer together at first, and at 84 px the strip closed up into
  three rows of identical holes with no picture in it. The frames are now half
  again as tall as the gap between the sprocket rows would allow them to be,
  and the sprockets are ticks rather than blocks: what survives the reduction
  is a band with something in it, run between two lines of perforations, which
  is the part that says film.

  Drawn after the fall-away and not before it, again as the gamepad does, so
  the recesses read at one depth across the whole strip. Under the fall-away
  the two outermost sprockets come out darker than the eight between them, and
  a row of holes that deepens towards the ends is a strip that has been bent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <!-- What a hole in the plate looks like from above: the far wall in
         shadow at the top, the near lip catching the lamp at the bottom. The
         same well the gamepad sinks its d-pad into. -->
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="0.45" stop-color="#b4b4b4"/>
      <stop offset="1" stop-color="#e2e2e2"/>
    </linearGradient>

    <rect id="strip" x="2.4" y="6.6" width="27.2" height="18.8" rx="1.8"/>
    <path id="strip-gloss" d="M1 4H31V15.4C25.4 17.6 6.6 17.6 1 15.4z"/>
    <clipPath id="strip-clip"><use href="#strip"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#strip" fill="url(#face)"/>
    <g clip-path="url(#strip-clip)">
      <use href="#strip-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#strip" fill="url(#turn)"/>
    <g clip-path="url(#strip-clip)">
      <use href="#strip" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
    </g>

    <!-- The two sprocket rows, at the same five stations top and bottom. -->
    <g fill="url(#recess)">
      <rect x="4.9" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="9.9" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="14.8" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="19.7" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="24.7" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="4.9" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="9.9" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="14.8" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="19.7" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="24.7" y="21.6" width="2.4" height="2.2" rx="0.6"/>
    </g>
    <g fill="none" stroke="url(#edge)" stroke-width="0.55">
      <rect x="4.9" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="9.9" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="14.8" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="19.7" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="24.7" y="8.2" width="2.4" height="2.2" rx="0.6"/>
      <rect x="4.9" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="9.9" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="14.8" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="19.7" y="21.6" width="2.4" height="2.2" rx="0.6"/>
      <rect x="24.7" y="21.6" width="2.4" height="2.2" rx="0.6"/>
    </g>

    <!-- And the two frames between the rows, which is the part being run
         through the gate. -->
    <g fill="url(#recess)">
      <rect x="4.9" y="11.9" width="10.4" height="8.2" rx="1"/>
      <rect x="16.7" y="11.9" width="10.4" height="8.2" rx="1"/>
    </g>
    <g fill="none" stroke="url(#edge)" stroke-width="0.7">
      <rect x="4.9" y="11.9" width="10.4" height="8.2" rx="1"/>
      <rect x="16.7" y="11.9" width="10.4" height="8.2" rx="1"/>
    </g>
  </g>
</svg>
