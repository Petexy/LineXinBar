<!--
  A key, on the rows a password is typed into.

  Deliberately not the padlock. This set already has one — authenticate.svg,
  which is what the panel asking for a password wears — and the two are not the
  same thing: a padlock is *the thing that is locked*, and a key is what somebody
  types to get past it. A form row asking for a password is asking for the key,
  and the row further down that hands the whole form to polkit is the lock. Two
  marks for two moments, so neither has to be read twice.

  The bow is a ring rather than a disc: a solid head with a hole would be the
  same drawing as a padlock's case seen from the wrong side, and a ring says
  "key" at the size a settings row is drawn. The two wards stand off the shaft
  as one body with it — a key's teeth are part of the key — so there is no seam
  to cut, unlike the two sheets of copy.svg.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <circle id="bow" cx="10.4" cy="10.4" r="6.4"/>
    <path id="shaft" d="M13.6 13.6L27.2 27.2A1.5 1.5 0 0 1 25.1 29.3L11.5 15.7Z"/>
    <g id="wards">
      <rect x="19.6" y="17.2" width="2.9" height="6.6" rx="1.45"
            transform="rotate(-45 21.05 20.5)"/>
      <rect x="23.4" y="21" width="2.9" height="6" rx="1.45"
            transform="rotate(-45 24.85 24)"/>
    </g>
    <circle id="hole" cx="10.4" cy="10.4" r="2.6"/>
    <g id="bead"><use href="#bow"/><use href="#shaft"/><use href="#wards"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#hole" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
