<!--
The user's own folder, at the head of the file explorer: a house.

  The one row in the column that is not answered by a drawing of what it is.
  Home *is* a folder — it is `/home/<name>` and it is on the same disk as Root
  is — so the honest mark for it would be the folder, and the honest mark is
  the wrong one: the three rows under it would then be a folder, a drum and a
  drum, with the folder meaning "yours" for no reason the drawing gives. A
  house says whose it is, which is the only thing that separates this row from
  the one below it.

  It is a house and not a roof. A roof alone — the mark half the world uses for
  Home — is a triangle with a notch, and a triangle in this material has no
  face to light: it is all bevel. The wall under it is what gives the lamp
  somewhere to land, and it is what carries the door.

  Roof and wall are one plate under one lamp, painted through a single mask.
  The roof is then lifted back out and lit a shade harder, because it is the
  surface tilted up towards the light — the same statement the lid makes on
  file-drive.svg. The eaves overhang the wall by about two units on each side,
  which is what stops the pair reading as a pentagon.

  The door is sunk rather than drawn: a dark face with a lit sill under it,
  which is how every recess in this set is made. It is deliberately plain —
  no handle, no window, no path up to it. At the size a row draws a glyph, a
  handle is one grey pixel and a window is two.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <!-- The corners are rounded by stroking each shape in its own fill: a
         mitre in this material is a place the lamp catches nothing, and every
         other object in the set turns over rather than meeting at a point. -->
    <path id="roof" d="M16 4.2L28.6 15.1H3.4z" stroke-width="1.5" stroke-linejoin="round"/>
    <rect id="wall" x="6.8" y="13.8" width="18.4" height="13.4" rx="1.8"/>
    <mask id="house-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <g fill="#ffffff" stroke="#ffffff">
        <use href="#roof"/><use href="#wall"/>
      </g>
    </mask>
    <clipPath id="house-clip">
      <g><use href="#roof"/><use href="#wall"/></g>
    </clipPath>
    <linearGradient id="house-face" gradientUnits="userSpaceOnUse" x1="0" y1="4.2" x2="0" y2="27.2">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="house-turn" gradientUnits="userSpaceOnUse" x1="3.4" y1="0" x2="28.6" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <!-- The roof, tilted up into the lamp. -->
    <linearGradient id="roof-face" gradientUnits="userSpaceOnUse" x1="0" y1="4.2" x2="0" y2="15.1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
    <linearGradient id="door-face" gradientUnits="userSpaceOnUse" x1="0" y1="18.9" x2="0" y2="27.2">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.5" stop-color="#a6a6a6"/>
      <stop offset="1" stop-color="#d2d2d2"/>
    </linearGradient>
    <path id="house-gloss" d="M2 3H30V17.4C24 19.4 8 19.4 2 17.4z"/>
  </defs>

  <g filter="url(#drop)">
    <g mask="url(#house-mask)">
      <rect x="0" y="0" width="32" height="32" fill="url(#house-face)"/>
      <use href="#house-gloss" fill="url(#gloss)" filter="url(#polish)"/>
      <rect x="0" y="0" width="32" height="32" fill="url(#house-turn)"/>
    </g>

    <!-- The roof over its own half of that plate, and the ridge along the top
         of it where the two slopes meet the lamp. -->
    <use href="#roof" fill="url(#roof-face)" stroke="url(#roof-face)"/>
    <path d="M16 4.9L27 14.4" fill="none" stroke="#ffffff" stroke-opacity="0.85"
          stroke-width="0.7" stroke-linecap="round"/>
    <path d="M16 4.9L5 14.4" fill="none" stroke="#ffffff" stroke-opacity="0.5"
          stroke-width="0.7" stroke-linecap="round"/>
    <!-- The eaves: the wall is behind the roof, so the line where one ends and
         the other begins is a shadow rather than an edge. -->
    <path d="M4.6 15.1h22.8" fill="none" stroke="#000000" stroke-opacity="0.16"
          stroke-width="0.8"/>

    <!-- The doorway. -->
    <rect x="13.1" y="18.9" width="5.8" height="8.3" rx="1" fill="url(#door-face)"/>
    <path d="M13.1 27.2h5.8" fill="none" stroke="#ffffff" stroke-opacity="0.7"
          stroke-width="0.7"/>
    <g clip-path="url(#house-clip)">
      <use href="#wall" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    </g>
  </g>
</svg>
