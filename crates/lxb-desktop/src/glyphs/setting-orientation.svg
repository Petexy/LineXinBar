<!--
The Orientation row's glyph: the existing 90-degree rotation monitor with a
single clockwise turn arrow around its upper-right corner.

  The monitor is setting-rotation-90.svg scaled and translated uniformly. Its
  portrait bezel is exactly axis-aligned and its neck and foot remain on the
  left: there is no extra lean that would turn 90 degrees into roughly 80.

  The arrow is one ordinary rounded-L shaft with a straight butt tail and a
  centred two-shoulder head. Its top edge and the head's inward shoulder each
  clear the bezel by 2.2 units, while both shaft runs stay exactly 2.4 units
  wide. The same clipped gloss and side shading used by the shell's other
  raised glyphs model the surface without changing that silhouette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <path id="bezel"
          d="M12.75 3.15h12.9a2 2 0 0 1 2 2v23.2a2 2 0 0 1-2 2h-12.9a2 2 0 0 1-2-2V5.15a2 2 0 0 1 2-2z"/>
    <path id="bezel-gloss"
          d="M9.35 1.05h19.7v13.52c-5.07 4.35-14.63 4.35-19.7 0z"/>
    <clipPath id="bezel-clip"><use href="#bezel"/></clipPath>
    <path id="pane" d="M13.25 6.15h11.9v21.2h-11.9z"/>
    <clipPath id="pane-clip"><use href="#pane"/></clipPath>
    <path id="arrow"
          d="M14 3.2H22.175
             A6.1 6.1 0 0 1 28.275 9.3
             V12.8H30.275L27.075 17.2 23.875 12.8H25.875V9.3
             A3.7 3.7 0 0 0 22.175 5.6H14Z"/>
    <path id="arrow-gloss"
          d="M12 2H32V8.9
             C29.6 9.1 27.2 8.2 24.8 6.4
             C21.8 4.2 17 4 12 4.45Z"/>
    <clipPath id="arrow-clip"><use href="#arrow"/></clipPath>
  </defs>

  <!-- This matrix is only a uniform 0.75 scale plus translation: b=c=0. -->
  <g filter="url(#drop)" transform="matrix(.75 0 0 .75 .9375 5.4375)">
    <!-- The complete stand after an exact clockwise 90-degree turn. -->
    <path d="M7.15 14.15h4.2v5.2h-4.2z" fill="url(#face)"/>
    <path d="M5.45 8.25h.8a1.1 1.1 0 0 1 1.1 1.1v14.8a1.1 1.1 0 0 1-1.1 1.1h-.8a1.1 1.1 0 0 1-1.1-1.1V9.35a1.1 1.1 0 0 1 1.1-1.1z"
          fill="url(#face)"/>
    <path d="M5.45 8.25h.8a1.1 1.1 0 0 1 1.1 1.1v14.8a1.1 1.1 0 0 1-1.1 1.1h-.8a1.1 1.1 0 0 1-1.1-1.1V9.35a1.1 1.1 0 0 1 1.1-1.1z"
          fill="none" stroke="url(#edge)" stroke-width="0.7"/>

    <use href="#bezel" fill="url(#face)"/>
    <g clip-path="url(#bezel-clip)">
      <use href="#bezel-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#bezel" fill="url(#turn)"/>

    <use href="#pane" fill="url(#recess)"/>
    <g clip-path="url(#pane-clip)">
      <path d="m13.25 24.38 5.47-18.23h3.1l-6.31 21.2z"
            fill="#ffffff" fill-opacity="0.34" filter="url(#polish)"/>
      <path d="m13.25 14.63 2.74-8.48h1.31l-4.05 12.3z"
            fill="#ffffff" fill-opacity="0.22" filter="url(#polish)"/>
    </g>
    <use href="#pane" fill="none" stroke="url(#edge)" stroke-width="0.7"/>
    <g clip-path="url(#bezel-clip)">
      <use href="#bezel" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
    </g>
  </g>

  <!--
    Bezel: x=9..21.675, y=7.8..28.2, r=1.5.
    Arrow centre C=(22.175,9.3), inner r=3.7, outer r=6.1.
    The head and shaft share x=27.075; the band is 2.4 units throughout.
  -->
  <use href="#arrow" fill="url(#face)"/>
  <g clip-path="url(#arrow-clip)">
    <use href="#arrow-gloss" fill="url(#gloss)" filter="url(#polish)"/>
  </g>
  <use href="#arrow" fill="url(#turn)"/>
</svg>
