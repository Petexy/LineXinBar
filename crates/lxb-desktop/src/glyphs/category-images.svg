<!--
  The Images subcategory's glyph: two mounts, one behind the other.

  Under Graphics, and the plural of it: where the parent column carries one
  landscape, this carries a stack of them, which is what a folder of images is.

  The scene in the front mount is the opening. The back mount is a second body
  standing behind the front one, so a crevice is cut between them — the field
  cannot tell two overlapping bodies from one, and without the gap the pair
  would come out as a single L-shaped blob with one rim round the outside.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="back" x="4.2" y="6.6" width="20.4" height="16.2" rx="2.4" transform="rotate(-10 14.4 14.7)"/>
    <rect id="front" x="8.2" y="10.4" width="20.4" height="16.2" rx="2.4"/>
    <g id="scene"><circle cx="13.4" cy="15.4" r="1.85"/><path d="M11.0 24.3L16.0 16.5l3.6 4.8 2.9-3.8 4.3 6.8z"/></g>
    <g id="bead"><use href="#back"/><use href="#front"/></g>
    <g id="holes"><use href="#scene"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#front" fill="#000000" stroke="#000000" stroke-width="0.85" stroke-linejoin="round"/>
      <use href="#front" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
