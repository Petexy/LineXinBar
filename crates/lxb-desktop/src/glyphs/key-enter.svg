<!--
  The Enter key, as the key it is.

  The same cap as key-escape.svg with the arrow every keyboard in the world
  prints on this one key: down the right-hand side and back to the left. It is
  the one keyboard mark that needs no explaining, which is why the cap round it
  can be the plain one.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect x="2.75" y="5.5" width="18.5" height="13" rx="3.2"
        fill="none" stroke="#fff" stroke-width="1.5"/>
  <g fill="none" stroke="#fff" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.6 8.7v4.6H9.1"/>
    <path d="M11.4 11 9 13.3l2.4 2.3"/>
  </g>
</svg>
