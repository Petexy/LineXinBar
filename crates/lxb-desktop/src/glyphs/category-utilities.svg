<!--
  The Utilities column's glyph: a toolbox.

  The toolbox the real XMB put on its settings column, kept for the column that
  actually collects tools. The seam along the lid is an opening and the catch
  under it is another, which is as much detail as an object this size will hold.

  The handle stands behind the box, so a crevice is cut round the box: without
  it the two would merge and the handle would read as a bite out of the top
  rather than as a thing to pick the box up by.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

