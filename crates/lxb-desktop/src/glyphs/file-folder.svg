<!--
One folder, as a row of the file explorer: a back with a tab, and a pocket
across the front of it.

  The most-drawn mark in the shell after the category row — every directory the
  user steps past is one of these — so it is built to be identified at a glance
  and never to be read. Two plates and nothing else on them: no papers, no
  label, no fold. Anything drawn *inside* the pocket would be a claim about
  what is in the folder, which this row cannot make until somebody presses it.

  The tab is on the left and only as wide as it needs to be. A tab running half
  the width of the plate turns the silhouette into a step rather than a folder,
  and at the size a bar row draws a glyph the step reads as a chipped corner.

  The pocket sits two and a half units below the back's top edge, which is the
  whole of the depth cue: what makes it a pocket rather than a panel is the
  strip of the back plate showing above it and the shadow it drops onto that
  strip. Both plates carry the drop shadow separately, as the two prints in
  category-images.svg do, and for the same reason — one shadow around the pair
  would make them a single flat cut-out shaped like a folder.

  See category-files.svg, which is two of these, and is to this drawing exactly
  what the stack of prints is to the one mounted picture.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <!-- The back: the tab and the plate under it, painted as one piece. Two
         rectangles into one mask rather than a path with a step in it, so the
         corner where the tab meets the plate is the overlap of two rounded
         shapes and not a notch that has to be mitred. -->
    <rect id="tab" x="4.0" y="7.4" width="11.6" height="6.6" rx="1.9"/>
    <rect id="back" x="4.0" y="10.0" width="24.0" height="14.6" rx="2.2"/>
    <rect id="pocket" x="4.0" y="12.6" width="24.0" height="12.0" rx="2.2"/>
    <mask id="back-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <g fill="#ffffff"><use href="#tab"/><use href="#back"/></g>
    </mask>
    <clipPath id="pocket-clip"><use href="#pocket"/></clipPath>
    <!-- One lamp down the whole of the back, tab included, in user space:
         a gradient per rectangle would light the tab as though it were an
         object of its own and put a seam where the two meet. -->
    <linearGradient id="back-face" gradientUnits="userSpaceOnUse" x1="0" y1="7.4" x2="0" y2="24.6">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <path id="pocket-gloss" d="M2.6 11H29.4V19.4C24.3 21.3 7.7 21.3 2.6 19.4z"/>
  </defs>

  <!-- The back, held a little darker than the pocket in front of it: the same
       plate, further from the lamp. -->
  <g filter="url(#drop)">
    <g mask="url(#back-mask)">
      <rect x="0" y="0" width="32" height="32" fill="url(#back-face)"/>
      <rect x="0" y="0" width="32" height="32" fill="url(#turn)"/>
      <rect x="0" y="0" width="32" height="32" fill="#000000" fill-opacity="0.09"/>
      <!-- The lit top edge of the tab, which is the highest thing in the
           drawing and the one the lamp reaches first. -->
      <path d="M5.9 7.6h7.8" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.7"/>
    </g>
  </g>

  <g filter="url(#drop)">
    <use href="#pocket" fill="url(#face)"/>
    <g clip-path="url(#pocket-clip)">
      <use href="#pocket-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#pocket" fill="url(#turn)"/>
    <g clip-path="url(#pocket-clip)">
      <use href="#pocket" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    </g>
  </g>
</svg>
