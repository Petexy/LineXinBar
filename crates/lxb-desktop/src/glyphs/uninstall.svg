<!--
  The bin, on the context menu row that removes an application.

  Three bodies stacked: the handle at the back, the lid bar over it and the bin
  under that, each taking a crevice against what is behind it. Stacked and not
  merged, because a bin whose lid has run into its body is a bucket.

  The two slots down the bin are openings. They were shading in the old drawing
  and they are the one thing that says which way up this is.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="handle" d="M13 4.1h6a1.7 1.7 0 0 1 1.7 1.7V9h-2.6V6.7h-4.2V9H11.3V5.8
                         A1.7 1.7 0 0 1 13 4.1z"/>
    <rect id="lid" x="5.6" y="8.5" width="20.8" height="3.5" rx="1.75"/>
    <path id="bin" d="M8.1 12.6h15.8l-1.42 13.3a2.3 2.3 0 0 1-2.29 2.05h-8.38
                      a2.3 2.3 0 0 1-2.29-2.05z"/>
    <g id="slots">
      <rect x="12.5" y="15.4" width="1.5" height="9.2" rx="0.75"/>
      <rect x="18" y="15.4" width="1.5" height="9.2" rx="0.75"/>
    </g>
    <g id="front"><use href="#lid"/><use href="#bin"/></g>
    <g id="bead"><use href="#handle"/><use href="#front"/></g>
    <g id="holes"><use href="#slots"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#front" fill="#000000" stroke="#000000" stroke-width="0.85" stroke-linejoin="round"/>
      <use href="#front" fill="#ffffff"/>
      <use href="#bin" fill="#000000" stroke="#000000" stroke-width="0.85" stroke-linejoin="round"/>
      <use href="#bin" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
