<!--
  An at sign, on the row that asks what somebody logs in as.

  The one mark that means "the name a machine knows you by" without a word of
  explanation, and it is not this shell's invention — which is the whole reason
  it is used, on the terms setting-bluetooth.svg's rune is: a shell that drew a
  better one would be asking the user to learn a symbol in order to find the
  symbol they already know.

  The ring is a stroke rather than two circles, and the `a` inside it is a
  stroke too, so the pair are one body of water with a gap between them rather
  than a disc with a hole and a blob in the hole. The tail of the ring stops
  short of closing: an at sign that closed would read as a spiral.

  Both strokes are 2.5 units, which is above the bevel's depth — the second of
  the three ways a shape goes wrong in category-games.svg.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="ring"
          d="M21.8 25.4A11.3 11.3 0 1 1 27.3 15.9C27.3 19.1 25.6 20.7 23.4 20.7C21.2 20.7 20 19.1 20 16.6V11.4"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle id="letter" cx="16" cy="16" r="4.2"
            fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <g id="bead"><use href="#ring"/><use href="#letter"/></g>
  </defs>

  <use href="#bead"/>
</svg>
