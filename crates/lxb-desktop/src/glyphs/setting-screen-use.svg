<!--
  A display with a tick standing in its screen, for the Screens in use rows.

  The same monitor setting-display.svg draws — bezel, neck and foot as one
  object, screen as an opening — with a tick laid down inside the opening. What
  the page does is say which screens the bar draws on, and a display with a
  tick in it is the plainest way to say that: the object the setting is about,
  wearing the answer the setting gives.

  Deliberately the same construction as setting-screen-rest.svg, which puts a
  moon in the same opening. The two pages are the two questions anybody asks
  about a screen they are not looking at — is it resting, is it used at all —
  and a reader who has learnt one drawing can read the other.

  The screen is cut before the tick is laid down. Painted the other way round
  the hole takes the tick with it, which is a monitor showing nothing and looks
  exactly like a monitor meant to show nothing.

  The tick is a filled outline rather than a stroke, like every other mark in
  this set, because the material is computed from the outline and a stroke has
  none to compute from. It is drawn fat for the same reason the resting moon is:
  a hairline tick is gone by the time the row is drawn at the size a
  quick-settings bar draws one.

  The scale is setting-display.svg's, unchanged and for the same reason: a shape
  has to leave room round itself for the shadow the shader casts beside it. The
  two are one object and have to stay one size.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="bezel" d="M4.4 5.1h23.2a2 2 0 0 1 2 2v12.9a2 2 0 0 1-2 2H4.4a2 2 0 0 1-2-2V7.1a2 2 0 0 1 2-2z"/>
    <path id="pane" d="M5.9 8.1h20.2v10.9H5.9z"/>
    <path id="neck" d="M13.4 22.4h5.2v3.8h-5.2z"/>
    <path id="foot" d="M8.6 25.7h14.8a1.1 1.1 0 0 1 1.1 1.1v0.9a1.1 1.1 0 0 1-1.1 1.1H8.6a1.1 1.1 0 0 1-1.1-1.1v-0.9a1.1 1.1 0 0 1 1.1-1.1z"/>
    <path id="tick" d="M10.63 13.86 L14.42 17.64 L20.63 10.69 L19.95 9.37 L14.42 15.00 L11.95 12.54 Z"/>
    <g id="bead"><use href="#bezel"/><use href="#neck"/><use href="#foot"/><use href="#tick"/></g>
    <g id="holes"><use href="#pane"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
      <use href="#tick" fill="#ffffff"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.963) translate(-16 -16)">

    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
