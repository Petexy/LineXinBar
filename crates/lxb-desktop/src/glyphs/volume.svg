<!--
  The volume bar's glyph. White and greys, because the shell tints what it
  draws: an atlas quad's colour is multiplied into the texel, so anything
  lighter than white is unreachable and anything coloured could only ever come
  out muddier than the label beside it.

  Lit by the same lamp as the two tiles above it in the column — see
  pointer-stick — but with less of the machinery, because a quick-settings bar
  gives its glyph 33 px on an ordinary display and a seam or a sunk well at
  that size is three grey pixels of smudge. Two things survive the reduction
  and both are used here.

  The first is that the lamp is *one* lamp. The gradient on the two waves is in
  user space, spanning the whole drawing rather than each arc separately, so
  the top of the outer wave is white and the bottom of it is grey — the arcs
  are lit by the same light as the cone instead of each carrying its own
  private copy of it. Per-element gradients are the obvious way to write this
  and they are what makes a drawing like this go flat: every mark ends up
  shaded identically, which is a diagram of shading rather than shading.

  The second is that the cone is a moulded object: a polished top whose lower
  edge curves with the body instead of ruling a line across it, sides turning
  away from the eye, a lit rim where the shell turns over at the top and again
  at the bottom off the bounce, and one soft shadow dropped behind the lot.

  volume-muted.svg repeats this body exactly. Muting has to read as a mark made
  on the speaker, which it cannot do if it is a differently-lit speaker.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- The lamp, in user space over the whole drawing. -->
    <linearGradient id="lit" gradientUnits="userSpaceOnUse" x1="0" y1="1.5" x2="0" y2="22.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.44" stop-color="#f4f4f4"/>
      <stop offset="0.82" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#e4e4e4"/>
    </linearGradient>

    <!-- The cone's material, before it is polished, over the body's own span. -->
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="4.4" x2="0" y2="19.6">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>

    <!-- The polish, laid on as its own shape so its lower edge can curve. -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="4.4" x2="0" y2="19.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>

    <!-- The back of the box turning away from the eye. Weighted to the left,
         because that end is the one facing away. -->
    <linearGradient id="turn" gradientUnits="userSpaceOnUse" x1="2.4" y1="0" x2="12.8" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.11"/>
      <stop offset="0.3" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.09"/>
    </linearGradient>

    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.28" dy="0.62" stdDeviation="0.34"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.12"/>
    </filter>

    <path id="cone" d="M2.4 9.2h4.9L12.8 4.4v15.2L7.3 14.8H2.4z"/>
    <path id="cone-gloss" d="M1.4 3h12.4v8.7c-2.5 1.4-9.9 1.4-12.4 0z"/>
    <clipPath id="cone-clip"><use href="#cone"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#cone" fill="url(#face)"/>
    <g clip-path="url(#cone-clip)">
      <use href="#cone-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#cone" fill="url(#turn)"/>
    <g clip-path="url(#cone-clip)">
      <use href="#cone" fill="none" stroke="url(#edge)" stroke-width="1"/>
    </g>

    <g fill="none" stroke="url(#lit)" stroke-width="1.9" stroke-linecap="round">
      <path d="M15.6 9.3a3.9 3.9 0 0 1 0 5.4"/>
      <path d="M18.3 6.4a7.9 7.9 0 0 1 0 11.2"/>
    </g>
  </g>
</svg>
