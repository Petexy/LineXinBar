<!--
  The Select button, as the pad it is on.

  An outlined pad with the button in question filled and its neighbour left
  open — the same distinction pad-west.svg makes, and it survives the material
  because a filled bead and a ring of one are different objects rather than two
  weights of the same line.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

