<!--
  The brightness bar's glyph: a sun.

  A disc and eight rays that do not touch it. The gap is what makes it a sun
  rather than a cog: two bodies of water that touch are one body and the field
  cannot be told otherwise — see category-games.svg. Here the gap was already in
  the drawing and only had to be left alone.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

