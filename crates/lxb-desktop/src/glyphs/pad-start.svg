<!--
  The Start button, as the pad it is on.

  pad-select.svg with the two small buttons exchanged: the one on the right is
  filled and its neighbour left open. Both are drawn on the pad's body because
  neither has a shape of its own to be recognised by — Start is a bar, a line,
  three lines or a house depending on whose pad it is, and only *where it sits*
  is the same on all of them.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"
        d="M7.7 7.4h8.6a4 4 0 0 1 3.9 3.1l0.95 4.3a2.35 2.35 0 0 1-4.25 1.85l-1.75-2.4H8.85l-1.75 2.4a2.35 2.35 0 0 1-4.25-1.85l0.95-4.3a4 4 0 0 1 3.9-3.1z"/>
  <circle cx="14.35" cy="11.6" r="2.1" fill="#fff"/>
  <circle cx="9.7" cy="11.6" r="1.35" fill="none" stroke="#fff" stroke-width="1.1"/>
</svg>
