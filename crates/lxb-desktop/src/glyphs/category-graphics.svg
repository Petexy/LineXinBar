<!--
The Graphics column's glyph: a picture in a mount.

  Image viewers, editors and painting tools. A brush was drawn for this first
  and thrown away after four attempts: a brush is legible because of its
  bristles, bristles are legible because of their texture, and this set has no
  texture — it is one white plastic under one lamp. Every version came out a
  trowel. A picture is what the column *holds* rather than what makes one,
  which is a weaker idea and a far stronger mark.

  It is a mount rather than a frame with a hole, for the reason given in
  category-system.svg: nothing here can be darker than the label beside it and
  a hole would show the application behind. So the picture is sunk into the
  mount and the landscape inside it is the brightest thing in the glyph, which
  is what a lit photograph in a card mount actually looks like.

  Kept squarer than the display in category-system.svg, and with no stand, so
  the two do not read as the same object at a glance in one row.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>

    <!-- The land, lit along its ridge and falling away below it. -->
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="0.55" stop-color="#e4e4e4"/>
      <stop offset="1" stop-color="#cdcdcd"/>
    </linearGradient>
    <rect id="mount" x="3.4" y="5.4" width="25.2" height="21.2" rx="3.2"/>
    <path id="mount-gloss" d="M2 3H30V14.2C25.24 16.2 6.76 16.2 2 14.2z"/>
    <clipPath id="mount-clip"><use href="#mount"/></clipPath>
    <clipPath id="window-clip"><rect x="6.4" y="8.4" width="19.2" height="15.2" rx="1.4"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#mount" fill="url(#face)"/>
    <g clip-path="url(#mount-clip)">
      <use href="#mount-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#mount" fill="url(#turn)"/>
    <g clip-path="url(#mount-clip)">
      <use href="#mount" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    </g>

    <!-- The picture, sunk into the mount. -->
    <rect x="6.4" y="8.4" width="19.2" height="15.2" rx="1.4" fill="url(#recess)"/>
    <g clip-path="url(#window-clip)">
      <circle cx="10.4" cy="12.1" r="2" fill="#ffffff" fill-opacity="0.92"/>
      <path d="M6.4 23.6L13 13.4l4.2 5.6 3.4-4.4 5 9z" fill="url(#hills)"/>
      <path d="M13 13.4l4.2 5.6 3.4-4.4 5 9" fill="none" stroke="#ffffff"
            stroke-opacity="0.75" stroke-width="0.7" stroke-linejoin="round"/>
      <rect x="6.4" y="8.4" width="19.2" height="15.2" rx="1.4"
            fill="none" stroke="url(#edge)" stroke-width="0.8"/>
    </g>
  </g>
</svg>
