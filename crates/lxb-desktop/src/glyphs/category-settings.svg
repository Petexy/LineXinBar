<!--
  The Settings column's glyph: a cog.

  This column is the shell's own settings and is always first, the way a
  console shell opens on Settings. A cog rather than the toolbox those used,
  because the toolbox is wanted two columns along for Utilities.

  The bore is the opening, and it is the one hole in the set that was already a
  hole in the object being drawn: a cog is a wheel with something taken out of
  the middle of it, which is exactly what water does when it is pulled round a
  shaft.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="cog" d="M12.97 6.58L13.56 3.34A12.8 12.8 0 0 1 18.44 3.34L19.03 6.58A9.8 9.8 0 0 1 20.45 7.17L23.16 5.29A12.8 12.8 0 0 1 26.61 8.74L24.73 11.45A9.8 9.8 0 0 1 25.32 12.87L28.56 13.46A12.8 12.8 0 0 1 28.56 18.34L25.32 18.93A9.8 9.8 0 0 1 24.73 20.35L26.61 23.06A12.8 12.8 0 0 1 23.16 26.51L20.45 24.63A9.8 9.8 0 0 1 19.03 25.22L18.44 28.46A12.8 12.8 0 0 1 13.56 28.46L12.97 25.22A9.8 9.8 0 0 1 11.55 24.63L8.84 26.51A12.8 12.8 0 0 1 5.39 23.06L7.27 20.35A9.8 9.8 0 0 1 6.68 18.93L3.44 18.34A12.8 12.8 0 0 1 3.44 13.46L6.68 12.87A9.8 9.8 0 0 1 7.27 11.45L5.39 8.74A12.8 12.8 0 0 1 8.84 5.29L11.55 7.17A9.8 9.8 0 0 1 12.97 6.58z"/>
    <circle id="bore" cx="16" cy="15.9" r="4.1"/>
    <g id="bead"><use href="#cog"/></g>
    <g id="holes"><use href="#bore"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
