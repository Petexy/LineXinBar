<!--
  The Input device row's glyph: a microphone on a stand.

  The second drawing in this set that is a picture of the thing it configures
  rather than a metaphor for it — see setting-display.svg, which is the other —
  and it is here for the reason that one is: an input device is a piece of
  hardware, and the picture of a microphone is not mistakable for anything
  else. The row above it, the output, wears the speaker the volume bar wears;
  a second speaker drawn for this set could only be the same speaker again.

  It stands on the display's own foot, near enough: same height, same width of
  bar, same corner radius. The two rows are read one under the other and the
  eye should find the same object twice — a thing on a stand — with only what
  is on top of it changed.

  The grille is three slots sunk into the capsule with the palette's well
  gradient, laid *under* the gloss rather than over it, so that what reads at
  105 px is a polished metal grille and what reads at 64 is texture. The
  bracket is the one mark here that is a stroke instead of a shape, and it
  carries the same user-space lamp volume.svg gives its waves: a gradient
  spanning the whole drawing, so the top of the bracket is lit like the capsule
  beside it instead of carrying a private copy of the light.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <!-- The lamp, in user space over the whole drawing, for the one mark that
         spans it. -->
    <linearGradient id="lit" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="23">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.44" stop-color="#f4f4f4"/>
      <stop offset="0.82" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#e4e4e4"/>
    </linearGradient>

    <!-- The slots of the grille, sunk into the capsule: darkest under the near
         wall, lightest off the bottom of the far one. The palette's wells, as
         the display's screen is. -->
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>

    <path id="capsule" d="M16 3.2a4.3 4.3 0 0 1 4.3 4.3v6.9a4.3 4.3 0 0 1-8.6 0V7.5A4.3 4.3 0 0 1 16 3.2z"/>
    <path id="capsule-gloss" d="M11 1.6h10v7.5c-3.1 1.5-6.9 1.5-10 0z"/>
    <clipPath id="capsule-clip"><use href="#capsule"/></clipPath>
    <path id="foot" d="M9.4 25.4h13.2a1.1 1.1 0 0 1 1.1 1.1v0.9a1.1 1.1 0 0 1-1.1 1.1H9.4a1.1 1.1 0 0 1-1.1-1.1v-0.9a1.1 1.1 0 0 1 1.1-1.1z"/>
  </defs>

  <g filter="url(#drop)">
    <!-- Stem and foot first, so the bracket and the capsule sit in front of
         the stand they grow out of rather than being cut by it. -->
    <path d="M15.15 20.4h1.7v5.2h-1.7z" fill="url(#face)"/>
    <use href="#foot" fill="url(#face)"/>
    <use href="#foot" fill="none" stroke="url(#edge)" stroke-width="0.7"/>

    <!-- The bracket the capsule hangs in, ending short of the shell's own
         width so that what wraps under it is visible as a separate part. -->
    <path d="M23.6 12.4v1.1a7.6 7.6 0 0 1-15.2 0v-1.1"
          fill="none" stroke="url(#lit)" stroke-width="1.9" stroke-linecap="round"/>

    <use href="#capsule" fill="url(#face)"/>
    <g clip-path="url(#capsule-clip)">
      <g fill="url(#slot)">
        <rect x="12.4" y="8.6" width="7.2" height="0.9" rx="0.45"/>
        <rect x="12.4" y="11" width="7.2" height="0.9" rx="0.45"/>
        <rect x="12.4" y="13.4" width="7.2" height="0.9" rx="0.45"/>
      </g>
      <use href="#capsule-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#capsule" fill="url(#turn)"/>
    <g clip-path="url(#capsule-clip)">
      <use href="#capsule" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
    </g>
  </g>
</svg>
