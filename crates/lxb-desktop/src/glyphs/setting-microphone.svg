<!--
  A microphone, for the input rows.

  Capsule, cradle and stand. The cradle is a stroke — an arc under the capsule,
  standing clear of it — and the three grille slots are openings cut through the
  capsule, which is what stops it reading as a pill.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="capsule" d="M16 3.2a4.3 4.3 0 0 1 4.3 4.3v6.9a4.3 4.3 0 0 1-8.6 0V7.5A4.3 4.3 0 0 1 16 3.2z"/>
    <path id="cradle" d="M23.6 12.4v1.1a7.6 7.6 0 0 1-15.2 0v-1.1"
          fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round"/>
    <rect id="stem" x="14.9" y="21" width="2.2" height="4.6" rx="1.1"/>
    <path id="foot" d="M9.4 25.4h13.2a1.1 1.1 0 0 1 1.1 1.1v0.9a1.1 1.1 0 0 1-1.1 1.1H9.4a1.1 1.1 0 0 1-1.1-1.1v-0.9a1.1 1.1 0 0 1 1.1-1.1z"/>
    <g id="grille">
      <rect x="12.4" y="8.6" width="7.2" height="0.9" rx="0.45"/>
      <rect x="12.4" y="11" width="7.2" height="0.9" rx="0.45"/>
      <rect x="12.4" y="13.4" width="7.2" height="0.9" rx="0.45"/>
    </g>
    <g id="bead"><use href="#capsule"/><use href="#cradle"/><use href="#stem"/><use href="#foot"/></g>
    <g id="holes"><use href="#grille"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
