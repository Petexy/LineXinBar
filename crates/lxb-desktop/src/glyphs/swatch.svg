<!--
  The disc a colour is shown on, in the accent rows.

  The plainest shape in the set: a bead of water and nothing else. What it is
  for is to be tinted — the quad's colour is what says which accent this row
  offers — so anything drawn into it would be a second thing competing with the
  one thing it has to say.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="15.9" r="11.4" fill="#fff"/>
</svg>
