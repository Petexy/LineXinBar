<!--
  The badge on the one control that turns high dynamic range on.

  A frame with its middle taken out and three letters standing in the hole. The
  letters are strokes, which the field measures like anything else, and they are
  bodies of their own rather than marks on a face — there is no face to mark.

  This badge is reserved for that control. Anything that merely explains
  something wears setting-info.svg instead.

  Drawn a little smaller than the old mark was. A shape has to leave room round
  itself for the shadow the shader casts beside it, and this one ran to within a
  unit of the cell's edge; the scale below is what brings it inside. The four
  rotations all carry the same factor whatever each needs on its own, because
  they are one object turned and have to stay one size.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="frame" fill-rule="evenodd" clip-rule="evenodd"
          d="M5 5h22a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z
             M5.25 8h21.5A1.25 1.25 0 0 1 28 9.25v13.5A1.25 1.25 0 0 1 26.75 24H5.25A1.25 1.25 0 0 1 4 22.75V9.25A1.25 1.25 0 0 1 5.25 8z"/>
    <path id="h" d="M1.25 10.7v10.6M6.25 10.7v10.6M1.25 16h5"/>
    <path id="d" d="M1.25 10.7v10.6h1.3c2.7 0 3.7-2 3.7-5.3s-1-5.3-3.7-5.3z"/>
    <path id="r" d="M1.25 21.3V10.7h1.8c2.1 0 3.2 1.15 3.2 2.9s-1.1 2.9-3.2 2.9H1.25 M3.45 16.5l2.8 4.8"/>
    <g id="letters" fill="none" stroke="#ffffff" stroke-width="2.05"
       stroke-linecap="round" stroke-linejoin="round">
      <use href="#h" transform="translate(4.75 0)"/>
      <use href="#d" transform="translate(12.25 0)"/>
      <use href="#r" transform="translate(19.75 0)"/>
    </g>
    <g id="bead"><use href="#frame"/><use href="#letters"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.8667) translate(-16 -16)">
  
    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
