<!--
The read-only Settings row's glyph: information, not another setting.

  These rows explain why a display mode or colour control is unavailable.  A
  circled i says that the row can be read but not changed, and keeps those
  explanations from borrowing the explicit HDR badge.  It is deliberately a
  ring rather than a filled medallion, so it has the same visual weight as the
  framed Settings glyphs beside it at the normal 64 px row size.

  Like HDR's letters, the i is geometry rather than text: built-in glyphs must
  not depend on any font installed outside the shell.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.3" stop-color="#eeeeee"/>
      <stop offset="0.56" stop-color="#d4d4d4"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.11"/>
      <stop offset="0.2" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="drop" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0.45" dy="1.05" stdDeviation="0.46"
                    flood-color="#303030" flood-opacity="0.48"/>
    </filter>
    <filter id="lift" x="-45%" y="-45%" width="200%" height="210%">
      <feDropShadow dx="0.22" dy="0.42" stdDeviation="0.18"
                    flood-color="#252525" flood-opacity="0.46"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.15"/>
    </filter>

    <circle id="outside" cx="16" cy="16" r="11.5"/>
    <circle id="inside" cx="16" cy="16" r="8.35"/>
    <path id="ring" fill-rule="evenodd" clip-rule="evenodd"
          d="M4.5 16a11.5 11.5 0 1 1 23 0 11.5 11.5 0 1 1-23 0z
             M7.65 16a8.35 8.35 0 1 0 16.7 0 8.35 8.35 0 1 0-16.7 0z"/>
    <path id="ring-gloss" d="M3 3h26v10.4c-6.6 2.4-19.4 2.4-26 0z"/>
    <clipPath id="ring-clip"><use href="#ring"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#ring" fill="url(#face)"/>
    <g clip-path="url(#ring-clip)">
      <use href="#ring-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#ring" fill="url(#turn)"/>
    <use href="#outside" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    <use href="#inside" fill="none" stroke="#ffffff" stroke-opacity="0.34"
         stroke-width="0.55"/>
  </g>

  <!-- The dot and stem are raised together, like one piece set into the ring. -->
  <g fill="url(#face)" stroke="url(#edge)" stroke-width="0.55"
     filter="url(#lift)">
    <circle cx="16" cy="11.2" r="1.45"/>
    <rect x="14.65" y="14.3" width="2.7" height="7.7" rx="1.35"/>
  </g>
</svg>
