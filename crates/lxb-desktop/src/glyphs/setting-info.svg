          d="M4.5 16a11.5 11.5 0 1 1 23 0 11.5 11.5 0 1 1-23 0z M7.65 16a8.35 8.35 0 1 0 16.7 0 8.35 8.35 0 1 0-16.7 0z"/>
    <circle cx="16" cy="11.2" r="1.45"/>
    <rect x="14.65" y="14.3" width="2.7" height="7.7" rx="1.35"/>
  </g>
</svg>
