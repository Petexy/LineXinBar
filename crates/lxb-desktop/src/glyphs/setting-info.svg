<!--
  The information mark, on any row that explains rather than sets.

  A ring with a dot and a bar standing in it. Three separate bodies and no
  crevices, because nothing here touches anything — the ring's bore is wide
  enough that the mark inside it has air all the way round.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

