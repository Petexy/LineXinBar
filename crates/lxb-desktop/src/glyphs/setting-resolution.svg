<!--
  A display with a grid of pixels in it and two arrows measuring it.

  The screen is an opening and everything inside it — six pixels, an arrow
  across and an arrow down — stands in that hole as bodies of their own. The
  pixels are the smallest shapes in the set and they are square on purpose: at
  this size a rounded one is a dot, and six dots are not a raster.

  Drawn a little smaller than the old mark was. A shape has to leave room round
  itself for the shadow the shader casts beside it, and this one ran to within a
  unit of the cell's edge; the scale below is what brings it inside. The four
  rotations all carry the same factor whatever each needs on its own, because
  they are one object turned and have to stay one size.

  The screen is cut before what stands in it is laid down. Painted the other way
  round the hole takes the contents with it, which is a monitor showing nothing
  and looks exactly like a monitor meant to show nothing.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="bezel" d="M4.2 3h23.6A3.2 3.2 0 0 1 31 6.2v14.1a3.2 3.2 0 0 1-3.2 3.2H4.2A3.2 3.2 0 0 1 1 20.3V6.2A3.2 3.2 0 0 1 4.2 3z"/>
    <rect id="pane" x="4.2" y="6" width="23.6" height="14.7" rx="0.45"/>
    <rect id="pixel" width="3.3" height="2.55" rx="0.2"/>
    <g id="content">
      <use href="#pixel" x="5.6" y="7.35"/>
      <use href="#pixel" x="9.55" y="7.35"/>
      <use href="#pixel" x="13.5" y="7.35"/>
      <use href="#pixel" x="5.6" y="10.55"/>
      <use href="#pixel" x="9.55" y="10.55"/>
      <use href="#pixel" x="13.5" y="10.55"/>
      <path d="m23.8 7.35 2.35 2.65h-1.45v3.4h1.45l-2.35 2.65-2.35-2.65h1.45V10H21.45z"/>
      <path d="m5.65 17.2 2.9-2.05v1.2h8.2v-1.2l2.9 2.05-2.9 2.05v-1.2h-8.2v1.2z"/>
    </g>
    <path id="neck" d="M13.4 22.4h5.2v3.8h-5.2z"/>
    <path id="foot" d="M8.6 25.7h14.8a1.1 1.1 0 0 1 1.1 1.1v0.9a1.1 1.1 0 0 1-1.1 1.1H8.6a1.1 1.1 0 0 1-1.1-1.1v-0.9a1.1 1.1 0 0 1 1.1-1.1z"/>
    <g id="bead"><use href="#bezel"/><use href="#neck"/><use href="#foot"/><use href="#content"/></g>
    <g id="holes"><use href="#pane"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
      <use href="#content" fill="#ffffff"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.8667) translate(-16 -16)">
  
    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
