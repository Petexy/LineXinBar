<!--
  The same chain, snapped: the row that leaves a network.

  Two hooks with a gap where the links parted. The gap is the whole mark, and it
  is the easiest thing in the set for the material to say — two ends facing each
  other, each with the wall standing up round it.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

