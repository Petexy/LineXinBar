<!--
  LineXinBar's fennec mark.

  lxb:shape — a shape and not a picture of one. Nothing here is shaded and
  nothing here should be: `icons::builtin_distance_field` measures how far every
  pixel is from the nearest edge, and `glyph_material` in shaders.wgsl stands the
  water up out of that. See category-games.svg, which carries the recipe.

  Ears, muzzle, whiskers, eyes and chin, all one material and all bodies in their
  own right. They were tried as openings first, on the rule the rest of the set
  follows — and that is wrong here, because the face does not lie inside the
  ears: cut as holes it fell outside them and simply disappeared. An opening
  needs something to be an opening in.

  Drawn in Inkscape on a page of its own, so the geometry arrives here in that
  page's coordinates and the two groups below are the whole of the conversion.
  The inner matrix is the page mapped into the 32-unit cell; the outer scale is
  the margin, and it is the only number in this file worth revisiting.

  The margin is 3.2 units at the ear tips, which is where the drawing was widest
  and where it ran out to the very edge of its page. It is not slack: the shader
  draws the mark's own shadow on the flat space beside it and can only draw it
  where the quad reaches, so a mark touching its cell edge has its shadow end in
  a straight cut. 0.8 is what puts the ears where the wide marks in the rest of
  the set stand — category-system's box is x 3.19..28.81 and this one's is the
  same to the pixel — and it lands the fennec exactly where the drawing it
  replaces stood, which is the other thing that had to stay true.
-->

