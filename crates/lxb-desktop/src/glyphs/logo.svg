     fill="#ffffff" stroke="none">
  <!-- The margin the shadow is drawn in. -->
  <g transform="translate(16 16) scale(0.8) translate(-16 -16)">
    <!-- The page the mark was drawn on, into the cell. -->
    <g transform="matrix(0.309050375,0,0,0.309147589,-17.728868,-22.176826)">
