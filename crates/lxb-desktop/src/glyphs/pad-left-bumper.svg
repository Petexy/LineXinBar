<!--
  The left bumper, as the pad it is on.

  pad-select.svg's pad, with the shoulder button on its left shoulder drawn over
  it as a bar. By side and place, as every button in this set is: a bumper is
  LB, L1, L or a nameless shoulder depending on whose pad it is, and the bar on
  that shoulder is the one thing all of them share. The pad is moved down so
  the two together sit in the middle of the cell. Its mirror is
  pad-right-bumper.svg.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g transform="translate(0 1.6)">
    <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"
          d="M7.7 7.4h8.6a4 4 0 0 1 3.9 3.1l0.95 4.3a2.35 2.35 0 0 1-4.25 1.85l-1.75-2.4H8.85l-1.75 2.4a2.35 2.35 0 0 1-4.25-1.85l0.95-4.3a4 4 0 0 1 3.9-3.1z"/>
    <rect x="3.6" y="3.4" width="6.8" height="2.5" rx="1.25" fill="#fff"/>
  </g>
</svg>
