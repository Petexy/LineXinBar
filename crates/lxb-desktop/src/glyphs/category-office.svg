<!--
The Office column's glyph: a sheet with its corner turned back.

  Word processors, spreadsheets and presentation tools; the thing they all
  produce is a page. A briefcase would say "work" rather than "documents", and
  this column is about the documents.

  The dog-ear is the reason for choosing a page over a plain rectangle. It is
  the one detail in the set that is *made* of the lighting rather than
  decorated by it: the flap shows the back of the sheet, which faces away from
  the lamp and so is darker than everything around it, and the crease throws a
  short shadow down the page. Take the light away and the fold stops being a
  fold — which is the difference this whole set is about.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8e8e"/>
      <stop offset="0.45" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#dedede"/>
    </linearGradient>

    <filter id="crevice" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.55" result="soft"/>
      <feFlood flood-color="#4a4a4a" flood-opacity="0.55" result="ink"/>
      <feComposite in="ink" in2="soft" operator="in"/>
    </filter>

    <!-- The back of the sheet, which faces away from the lamp. -->
    <linearGradient id="backing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <path id="page" d="M8.6 3h11l6.2 6.4v16.4a1.8 1.8 0 0 1-1.8 1.8H8.6a1.8 1.8 0 0 1-1.8-1.8V4.8A1.8 1.8 0 0 1 8.6 3z"/>
    <path id="page-gloss" d="M4 1H28V13.6C23.92 15.47 8.08 15.47 4 13.6z"/>
    <clipPath id="page-clip"><use href="#page"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#page" fill="url(#face)"/>
    <g clip-path="url(#page-clip)">
      <use href="#page-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#page" fill="url(#turn)"/>
    <g clip-path="url(#page-clip)">
      <use href="#page" fill="none" stroke="url(#edge)" stroke-width="1.1"/>
      <!-- The shadow the raised flap throws down the sheet. -->
      <use href="#flap" filter="url(#crevice)"/>
    </g>

    <!-- The flap: the back of the paper, turned away from the lamp. -->
    <path id="flap" d="M19.6 3v6.4h6.4z" fill="url(#backing)"/>

    <!-- Lines of text, pressed into the page. -->
    <g fill="url(#recess)">
      <rect x="10.2" y="13.4" width="11.6" height="1.5" rx="0.75"/>
      <rect x="10.2" y="17.4" width="11.6" height="1.5" rx="0.75"/>
      <rect x="10.2" y="21.4" width="7.4" height="1.5" rx="0.75"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.7">
      <rect x="10.2" y="14.85" width="11.6" height="0.5" rx="0.25"/>
      <rect x="10.2" y="18.85" width="11.6" height="0.5" rx="0.25"/>
      <rect x="10.2" y="22.85" width="7.4" height="0.5" rx="0.25"/>
    </g>
  </g>
</svg>
