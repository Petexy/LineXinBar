<!--
The Refresh rate row's glyph: the same screen, redrawing itself.

The frame is setting-resolution.svg's, to the coordinate, because the two rows
are the two halves of one setting and sit one under the other on the same page:
what tells them apart has to be the mark inside the screen, not the screen. So
the pixel blocks and the dimension arrows come out and one broad cycle arrow
goes in, sized to the same weight as the arrows it replaces so neither row
reads as the louder of the pair.

The picture stays a real opening, as it is there: the shell's dark wallpaper
supplies the black screen while the drawing itself stays cleanly tintable by
the atlas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.3" stop-color="#eeeeee"/>
      <stop offset="0.56" stop-color="#d4d4d4"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.11"/>
      <stop offset="0.2" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="0.35" dy="0.75" stdDeviation="0.35"
                    flood-color="#303030" flood-opacity="0.44"/>
    </filter>
    <filter id="lift" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0.22" dy="0.42" stdDeviation="0.18"
                    flood-color="#252525" flood-opacity="0.46"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.15"/>
    </filter>

    <path id="frame-outline"
          d="M4.4 4h23.2A3.4 3.4 0 0 1 31 7.4v17.2a3.4 3.4 0 0 1-3.4 3.4H4.4A3.4 3.4 0 0 1 1 24.6V7.4A3.4 3.4 0 0 1 4.4 4z"/>
    <path id="frame" fill-rule="evenodd" clip-rule="evenodd"
          d="M4.4 4h23.2A3.4 3.4 0 0 1 31 7.4v17.2a3.4 3.4 0 0 1-3.4 3.4H4.4A3.4 3.4 0 0 1 1 24.6V7.4A3.4 3.4 0 0 1 4.4 4z
             M4.4 7h23.2v17.7H4.4z"/>
    <path id="frame-gloss" d="M0 0h32v11.4c-7.8 2.5-24.2 2.5-32 0z"/>
    <clipPath id="frame-clip"><use href="#frame"/></clipPath>
    <rect id="picture" x="4.4" y="7" width="23.2" height="17.7" rx="0.45"/>
  </defs>

  <use href="#picture" fill="none" stroke="#ffffff" stroke-opacity="0.28"
       stroke-width="0.5"/>

  <g filter="url(#drop)">
    <use href="#frame" fill="url(#face)"/>
    <g clip-path="url(#frame-clip)">
      <use href="#frame-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#frame" fill="url(#turn)"/>
    <use href="#frame-outline" fill="none" stroke="url(#edge)" stroke-width="1.15"/>
  </g>

  <!-- The cycle: three quarters of a ring with a head on the leading end, so
       it reads as one turn continuing rather than as a broken circle. Drawn at
       the weight of the dimension arrows next door, and left open at the top
       right where the head has room to sit clear of the frame. -->
  <g filter="url(#lift)">
    <path d="M21.11 13.25A5.9 5.9 0 1 1 16 10.3"
          fill="none" stroke="url(#face)" stroke-width="2.5" stroke-linecap="butt"/>
    <path d="M21.11 13.25A5.9 5.9 0 1 1 16 10.3"
          fill="none" stroke="url(#edge)" stroke-width="0.5" stroke-linecap="butt"/>
    <path d="m19.1 10.3-3.5 2.1V8.2z"
          fill="url(#face)" stroke="url(#edge)" stroke-width="0.55"
          stroke-linejoin="round"/>
  </g>
</svg>
