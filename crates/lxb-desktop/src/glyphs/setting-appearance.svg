<!--
  A painter's palette, at the head of the appearance rows.

  The thumb hole is in the palette's own path and the three wells are openings
  cut through it. In the old drawing the wells were sunk and shaded; as holes
  they read at a settings row's size, which the sunk ones did not.

  Drawn a little smaller than the old mark was. A shape has to leave room round
  itself for the shadow the shader casts beside it, and this one ran to within a
  unit of the cell's edge; the scale below is what brings it inside. The four
  rotations all carry the same factor whatever each needs on its own, because
  they are one object turned and have to stay one size.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="palette" fill-rule="evenodd"
          d="M15.7 3.8C22.5 3.8 28.1 7.7 29 12.9C30 18.3 26.1 23.8 20.6 26.1C18.3 27.1 15.9 27.2 14.4 25.8C13.2 24.6 14 22.9 13.9 21.4C13.8 19.9 12.6 18.8 10.9 18.8C9.6 18.8 8.7 19.5 7.3 19.5C3.8 19.5 1.8 16.8 2.5 13.3C3.5 7.9 9.1 3.8 15.7 3.8z
             M21.4 16.1C19.65 16.1 18.35 17.65 18.35 19.7C18.35 21.75 19.65 23.3 21.4 23.3C23.15 23.3 24.45 21.75 24.45 19.7C24.45 17.65 23.15 16.1 21.4 16.1z"/>
    <g id="wells">
      <circle cx="8.7" cy="11.7" r="1.9"/>
      <circle cx="13.6" cy="8.4" r="1.9"/>
      <circle cx="19.6" cy="9.3" r="1.9"/>
    </g>
    <g id="bead"><use href="#palette"/></g>
    <g id="holes"><use href="#wells"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.963) translate(-16 -16)">
  
    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
