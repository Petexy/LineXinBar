<!--
  The mark every row that came out of Steam wears.

  Valve's own path, exactly as category-steam.svg carries it and for the same
  reason: this is a mark that has to be recognised rather than read, so its
  geometry is not something to have an opinion about. The transform differs
  because this cell is not that cell — a badge sits on a row and wants a little
  more air than a column head does — but the `d` attributes are the same four
  strings, and they should stay that way.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="valve" transform="translate(3.400 0.912) scale(0.45699)" d="M30.31 23.985l.003.158-7.83 11.375c-1.268-.058-2.54.165-3.748.662a8.14 8.14 0 0 0-1.498.8L.042 29.893s-.398 6.546 1.26 11.424l12.156 5.016c.6 2.728 2.48 5.12 5.242 6.27a8.88 8.88 0 0 0 11.603-4.782 8.89 8.89 0 0 0 .684-3.656L42.18 36.16l.275.005c6.705 0 12.155-5.466 12.155-12.18s-5.44-12.16-12.155-12.174c-6.702 0-12.155 5.46-12.155 12.174z"/>
    <path id="nock-bore" transform="translate(3.400 0.912) scale(0.45699)" d="M28.43 47.035c-1.454 3.5-5.466 5.147-8.953 3.694a6.84 6.84 0 0 1-3.524-3.362l3.957 1.64a5.04 5.04 0 0 0 6.591-2.719 5.05 5.05 0 0 0-2.715-6.601l-4.1-1.695c1.578-.6 3.372-.62 5.05.077 1.7.703 3 2.027 3.696 3.72s.692 3.56-.01 5.246"/>
    <path id="ring-bore" transform="translate(3.400 0.912) scale(0.45699)" d="M42.466 32.1a8.12 8.12 0 0 1-8.098-8.113 8.12 8.12 0 0 1 8.098-8.111 8.12 8.12 0 0 1 8.1 8.111 8.12 8.12 0 0 1-8.1 8.113"/>
    <path id="ring-boss" transform="translate(3.400 0.912) scale(0.45699)" d="M36.398 23.974a6.09 6.09 0 0 1 6.08-6.095c3.355 0 6.084 2.73 6.084 6.095a6.09 6.09 0 0 1-6.084 6.093 6.09 6.09 0 0 1-6.081-6.093z"/>
    <g id="bead"><use href="#valve"/></g>
    <g id="holes"><use href="#nock-bore"/><use href="#ring-bore"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
      <use href="#ring-boss" fill="#ffffff"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
