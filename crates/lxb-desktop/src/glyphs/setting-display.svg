<!--
  A display on a stand, at the head of the display rows.

  Bezel, neck and foot are one object — the stand is what the bezel is standing
  on, not a thing beside it — and the screen is an opening. A display drawn in
  this material cannot have a picture on it, and does not need one: a screen is
  a hole in a bezel to begin with.

  Drawn a little smaller than the old mark was. A shape has to leave room round
  itself for the shadow the shader casts beside it, and this one ran to within a
  unit of the cell's edge; the scale below is what brings it inside. The four
  rotations all carry the same factor whatever each needs on its own, because
  they are one object turned and have to stay one size.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="bezel" d="M4.4 5.1h23.2a2 2 0 0 1 2 2v12.9a2 2 0 0 1-2 2H4.4a2 2 0 0 1-2-2V7.1a2 2 0 0 1 2-2z"/>
    <path id="pane" d="M5.9 8.1h20.2v10.9H5.9z"/>
    <path id="neck" d="M13.4 22.4h5.2v3.8h-5.2z"/>
    <path id="foot" d="M8.6 25.7h14.8a1.1 1.1 0 0 1 1.1 1.1v0.9a1.1 1.1 0 0 1-1.1 1.1H8.6a1.1 1.1 0 0 1-1.1-1.1v-0.9a1.1 1.1 0 0 1 1.1-1.1z"/>
    <g id="bead"><use href="#bezel"/><use href="#neck"/><use href="#foot"/></g>
    <g id="holes"><use href="#pane"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.963) translate(-16 -16)">
  
    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
