<!--
  The System column's glyph: a display on a stand.

  System collects the things that administer the machine — the XDG `System` and
  `Settings` groups both land here — and a monitor is the one object that says
  "the computer itself" without saying which part of it.

  The screen is the opening. A display drawn in water cannot have a picture on
  it, but a screen is a hole in a bezel to begin with, and one with the ring of
  a raised rim standing round it is a better display than any grey rectangle
  would have been.

  Panel, neck and foot are one body and run into each other on purpose: no
  crevice is cut between them, because they are one object and a seam ruled
  across a solid would read as a crack in it.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="panel" x="3.2" y="4" width="25.6" height="17.2" rx="2.6"/>
    <rect id="neck" x="13.6" y="19.6" width="4.8" height="5" rx="0.8"/>
    <rect id="foot" x="8.8" y="23.8" width="14.4" height="3.2" rx="1.6"/>
    <rect id="screen" x="6.4" y="7.1" width="19.2" height="11" rx="1.4"/>
    <g id="bead"><use href="#panel"/><use href="#neck"/><use href="#foot"/></g>
    <g id="holes"><use href="#screen"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
