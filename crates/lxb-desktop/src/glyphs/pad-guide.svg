<!--
  The guide button, as the pad it is on.

  pad-select.svg's body with one bead in the middle of it and no neighbour.
  Where it sits is the whole of what names it, on pad-start.svg's rule taken one
  step further: the guide button is a sphere, a house, a logo, an oval or a
  letter depending on whose pad it is, and the only thing true of every one of
  them is that it is *the button between the other two*. Drawn alone rather than
  as the middle of three, because three beads across this body at the size a
  legend is drawn are three smudges — and a bead centred in a shape is centred
  whether or not its neighbours are there to prove it.

  A shade larger than pad-select.svg's filled one, which is also true of the
  object: the button in the middle of a pad is the biggest on its face.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"
        d="M7.7 7.4h8.6a4 4 0 0 1 3.9 3.1l0.95 4.3a2.35 2.35 0 0 1-4.25 1.85l-1.75-2.4H8.85l-1.75 2.4a2.35 2.35 0 0 1-4.25-1.85l0.95-4.3a4 4 0 0 1 3.9-3.1z"/>
  <circle cx="12" cy="11.6" r="2.35" fill="#fff"/>
</svg>
