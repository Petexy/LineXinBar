<!--
  The east face button, as the four of them.

  pad-west.svg with the bead moved round the cluster, and deliberately nothing
  else: the two are the same picture of the same pad, and a hand that has
  learnt to read one has learnt to read the other. East is Back on every
  layout this shell knows, which is why it is the one that says Cancel.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="12" cy="5.3" r="2.7"/>
    <circle cx="5.3" cy="12" r="2.7"/>
    <circle cx="12" cy="18.7" r="2.7"/>
  </g>
  <circle cx="18.7" cy="12" r="3.4" fill="#fff"/>
</svg>
