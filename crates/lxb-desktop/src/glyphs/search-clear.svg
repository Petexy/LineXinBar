<!--
  The magnifier with a cross in it, on the row that empties a search.

  search.svg's mark exactly, with the cross laid into the lens. The cross is
  part of the same body rather than a separate one, so it reads as a bar welded
  across the glass rather than as something floating in the hole — at the size
  a shelf head is drawn there is no room for a crevice inside a lens.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="#fff">
      <rect x="0" y="-2.1" width="11.3" height="4.2" rx="2.1"
            transform="translate(18.6 18.2) rotate(45)"/>
      <path fill-rule="evenodd"
            d="M13.6 4.4a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 1 0 0-17.6z
               m0 3.1a5.7 5.7 0 1 1 0 11.4 5.7 5.7 0 1 1 0-11.4z"/>
      <rect x="-3.4" y="-1.1" width="6.8" height="2.2" rx="1.1"
            transform="translate(13.6 13.2) rotate(45)"/>
      <rect x="-3.4" y="-1.1" width="6.8" height="2.2" rx="1.1"
            transform="translate(13.6 13.2) rotate(-45)"/>
  </g>
</svg>
