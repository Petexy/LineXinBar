<!--
  The Development column's glyph: two angle brackets and a slash.

  The mark every editor and every terminal in the XDG `Development` group is
  already wearing, which is worth more here than anything more literal.

  No openings. The slash crosses both brackets, so a crevice is cut round it —
  three rods that met with no gap would be one X-shaped body of water, and the
  crossing is the whole of what makes this read as code.

  The rods are thin, and thin is correct: a part narrower than twice the bevel
  is all wall, which is what a rod of water looks like.

  lxb:shape — the material is computed from this outline. See
  category-games.svg, which is where it is explained.
-->

