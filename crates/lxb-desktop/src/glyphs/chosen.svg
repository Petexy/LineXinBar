<!--
The mark on the value a setting is currently set to: a tick, on a badge.

  It is drawn over the corner of the row's own icon — over a swatch, usually,
  which is to say over a colour this drawing knows nothing about. That is the
  whole of why it is a badge rather than a bare tick: a stroke laid straight on
  an unknown colour is legible against about half of them, and the disc under
  this one gives the mark a surface of its own whatever it lands over.

  The tick is cut *into* that surface rather than laid on it. Nothing in this
  set may go dark — the atlas multiplies the quad's colour into the texel, so a
  near-black mark would come back as a hole punched in the badge rather than as
  ink on it — which leaves one legible way to draw a mark on a white disc: sink
  it, and light the groove the way every other fold in the set is lit. The
  shoulder catches the lamp along the top of the stroke, the floor of it is the
  darkest value the drawing is allowed, and the two together are what make it
  read as a tick at the size of a badge on the corner of an icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#d9d9d9"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#9e9e9e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8c8c8c" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.4" dy="1" stdDeviation="0.7"
                    flood-color="#3c3c3c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <circle cx="16" cy="16" r="12.2" fill="url(#badge)"/>
    <circle cx="16" cy="16" r="12.2" fill="none" stroke="url(#rim)" stroke-width="1.1"/>

    <!-- The groove, and the lit shoulder half a stroke above it. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.3 16.4L14.2 20.3L21.7 11.9" stroke="#ffffff" stroke-width="3.4"/>
      <path d="M10.5 16.9L14.2 20.6L21.9 12.3" stroke="#8c8c8c" stroke-width="2.9"/>
    </g>
  </g>
</svg>
